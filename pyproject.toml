[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Production RAG chatbot: Groq + BGE-M3 + Pinecone"
readme = "README.md"
requires-python = ">=3.11,<3.13"

# --- Runtime dependencies ---
dependencies = [
    # LangChain ecosystem
    "langchain==0.3.0",
    "langchain-community==0.3.0",
    "langchain-groq==0.2.0",
    "langchain-pinecone==0.2.0",
    "langchain-huggingface==0.1.0",

    # Embeddings + reranker (CPU, no API cost)
    "sentence-transformers==3.1.0",
    "transformers==4.44.0",
    "torch>=2.4,<3",

    # Vector store + sparse retrieval
    "pinecone-client==5.0.0",
    "rank-bm25==0.2.2",

    # Document loading
    "pypdf==4.3.0",
    "tiktoken==0.7.0",

    # API server
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.0",
    "python-multipart==0.0.12",

    # Evaluation
    "ragas==0.2.0",
    "nltk==3.9.1",
    "datasets==2.21.0",
    "langsmith==0.1.129",

    # Utilities
    "python-dotenv==1.0.0",
    "tqdm==4.66.4",
    "pydantic==2.9.0",
    "pydantic-settings==2.5.0",
    "tenacity==8.5.0",
    "structlog==24.4.0",
    "groq==0.11.0",
    "pandas==2.2.0",
]

# --- Project scripts: uv run <script> ---
[project.scripts]
ingest = "rag_chatbot.ingestion.ingest:run_ingestion"
serve = "rag_chatbot.api.main:start"
evaluate = "rag_chatbot.evaluation.evaluate:run_evaluation"

# --- Dev dependencies (not in Docker) ---
[dependency-groups]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.0",
    "ruff==0.6.0",
    "pre-commit==3.8.0",
]

# --- Build system ---
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_chatbot"]

# --- Ruff (linter + formatter) ---
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow bare assert in tests

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"